<section class="hero-section" (mousemove)="onMouseMove($event)">
  <div class="grid-container">
    
    <div class="hero-layout">
      <!-- Typography -->
      <div class="hero-text">
        <h1 class="h-hero">
          BUILDING<br>
          SOFTWARE<br>
          FOR<br>
          <span class="text-accent">REAL WORK.</span>
        </h1>
        
        <div class="hero-meta mt-4">
          <p class="text-body max-w-sm">
            Executive Software Developer building internal business systems across recruitment, CRM, ERP, and operational workflows.
          </p>
          <div class="mt-2">
            <a href="#experience" class="btn-editorial interactive">View Systems</a>
          </div>
        </div>
      </div>
      
      <!-- 3D Perspective Software Layers -->
      <div class="hero-visual">
        <div class="perspective-container">
          <div class="system-stack" [style.transform]="'rotateX(15deg) rotateY(-20deg) translateX(' + (mouseX * 20) + 'px) translateY(' + (mouseY * 20) + 'px)'">
            
            <!-- Layer 1 -->
            <div class="ui-layer layer-bottom">
              <div class="ui-header">
                <span class="text-meta">ERP / INVENTORY</span>
              </div>
              <div class="ui-body">
                <div class="ui-line" style="width: 80%"></div>
                <div class="ui-line" style="width: 60%"></div>
                <div class="ui-line" style="width: 90%"></div>
              </div>
            </div>
            
            <!-- Layer 2 -->
            <div class="ui-layer layer-middle">
              <div class="ui-header">
                <span class="text-meta">CRM / LEADS</span>
              </div>
              <div class="ui-body">
                <div class="ui-grid">
                  <div class="ui-box"></div>
                  <div class="ui-box"></div>
                </div>
                <div class="ui-line mt-1" style="width: 100%"></div>
              </div>
            </div>
            
            <!-- Layer 3 -->
            <div class="ui-layer layer-top">
              <div class="ui-header">
                <span class="text-meta text-accent">RECRUITMENT / PIPELINE</span>
              </div>
              <div class="ui-body">
                <div class="ui-row">
                  <span>Candidate</span>
                  <span>Status</span>
                </div>
                <div class="ui-line mt-1"></div>
                <div class="ui-row mt-1 text-muted">
                  <span>A. Ghosh</span>
                  <span>Hired</span>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
      
    </div>
    
  </div>
</section>
